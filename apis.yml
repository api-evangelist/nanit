name: Nanit
description: 'Nanit is a consumer smart baby-monitoring company whose camera-based system tracks infant
  sleep patterns, monitors breathing motion through wearable Breathing Wear, and sends real-time safety
  notifications to parents. Its products pair 1080p HD video with computer-vision analytics, alongside a
  companion mobile app, sound machines, and sleep-guidance content, sold direct-to-consumer as hardware plus
  app subscriptions. As of this enrichment pass Nanit publishes no public developer API, SDK, CLI, or webhook
  surface for third-party integration.'
